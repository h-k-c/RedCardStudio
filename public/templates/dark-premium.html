<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>暗黑高级风 - 教程</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: #000; padding: 40px;
    }
    .card-canvas {
      width: var(--canvas-width); height: var(--canvas-height);
      background: #0C0C0C;
      padding: 0; display: flex; flex-direction: column;
      position: relative; overflow: hidden;
      font-family: "Noto Sans SC", sans-serif; color: #F0F0F0;
    }

    /* 金色渐变装饰 */
    .gold-gradient {
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, #C9A96E, #E8D5A3, #C9A96E, transparent);
    }
    .gold-gradient--bottom {
      top: auto; bottom: 0;
    }

    .inner {
      flex: 1; display: flex; flex-direction: column;
      padding: 64px 72px;
      border: 1px solid #1F1F1F;
      margin: 24px;
      position: relative;
    }

    .header { margin-bottom: 48px; }
    .header__eyebrow {
      font-family: "Cormorant Garamond", serif;
      font-size: 14px; font-weight: 500; font-style: italic;
      color: #C9A96E; letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: 20px;
    }
    .header__title {
      font-family: "Noto Serif SC", serif;
      font-size: 44px; font-weight: 700; line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .header__title em {
      font-style: normal; color: #C9A96E;
    }
    .header__line {
      width: 50px; height: 1px; background: #C9A96E; margin-top: 24px;
    }

    .content { flex: 1; display: flex; flex-direction: column; gap: 32px; }
    .point {
      display: grid; grid-template-columns: 40px 1fr; gap: 20px;
      padding-bottom: 28px; border-bottom: 1px solid #1A1A1A;
    }
    .point:last-child { border-bottom: none; }
    .point__num {
      font-family: "Cormorant Garamond", serif;
      font-size: 32px; font-weight: 300; color: #C9A96E;
      line-height: 1;
    }
    .point__body {}
    .point__title {
      font-family: "Noto Serif SC", serif;
      font-size: 22px; font-weight: 600; margin-bottom: 8px;
      color: #EEEEEE;
    }
    .point__desc {
      font-size: 15px; color: #888; line-height: 1.8;
    }
    .point__highlight {
      display: inline-block; margin-top: 10px;
      padding: 5px 14px; border: 1px solid #333;
      font-size: 12px; color: #C9A96E;
      letter-spacing: 0.05em;
    }

    .footer {
      margin-top: auto; padding-top: 24px;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #1A1A1A;
    }
    .footer__left {
      font-size: 12px; color: #555; letter-spacing: 0.1em;
    }
    .footer__right {
      font-family: "Cormorant Garamond", serif;
      font-size: 16px; color: #555; font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card-canvas">
    <div class="gold-gradient"></div>
    <div class="gold-gradient gold-gradient--bottom"></div>

    <div class="inner">
      <div class="header">
        <p class="header__eyebrow">Luxury · Branding</p>
        <h1 class="header__title">打造个人品牌<br>的<em>三层心法</em></h1>
        <div class="header__line"></div>
      </div>

      <div class="content">
        <div class="point">
          <span class="point__num">I</span>
          <div class="point__body">
            <h3 class="point__title">定义你的「精神内核」</h3>
            <p class="point__desc">品牌不是 logo 和配色，而是你持续传递的一种价值观。找到你最真实的那个点，反复打磨。</p>
            <span class="point__highlight">核心 = 你相信什么 × 别人需要什么</span>
          </div>
        </div>
        <div class="point">
          <span class="point__num">II</span>
          <div class="point__body">
            <h3 class="point__title">建立「视觉记忆点」</h3>
            <p class="point__desc">统一的色彩、字体、排版风格让人一眼认出你。不需要复杂，需要一致。重复即记忆。</p>
            <span class="point__highlight">一致性 > 创意性</span>
          </div>
        </div>
        <div class="point">
          <span class="point__num">III</span>
          <div class="point__body">
            <h3 class="point__title">用「内容节奏」留住人</h3>
            <p class="point__desc">干货建立信任，故事建立情感，互动建立粘性。三者交替出现，形成内容呼吸感。</p>
          </div>
        </div>
      </div>

      <div class="footer">
        <span class="footer__left">@ 你的账号名</span>
        <span class="footer__right">Page 01</span>
      </div>
    </div>
  </div>
</body>
</html>
