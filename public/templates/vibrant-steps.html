<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>活力元气风 - 步骤式</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: #2A1F4E; padding: 40px;
    }
    .card-canvas {
      width: var(--canvas-width); height: var(--canvas-height);
      background: #FFF8F0;
      padding: 56px;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
      font-family: "Noto Sans SC", sans-serif;
      border-radius: 0;
    }

    /* 背景装饰圆 */
    .deco-circle {
      position: absolute; border-radius: 50%; pointer-events: none;
    }
    .deco-circle--1 { width: 300px; height: 300px; top: -80px; right: -60px; background: #FFE0B2; opacity: 0.6; }
    .deco-circle--2 { width: 200px; height: 200px; bottom: 100px; left: -60px; background: #C8E6C9; opacity: 0.5; }
    .deco-circle--3 { width: 150px; height: 150px; bottom: -40px; right: 100px; background: #BBDEFB; opacity: 0.4; }

    .header { position: relative; z-index: 1; margin-bottom: 40px; }
    .header__emoji { font-size: 40px; margin-bottom: 12px; }
    .header__title {
      font-family: "Fredoka", "Noto Sans SC", sans-serif;
      font-size: 48px; font-weight: 700; line-height: 1.15;
      color: #2D2D2D; letter-spacing: -0.02em;
    }
    .header__title span { 
      background: linear-gradient(120deg, #FF6B6B, #FF8E53);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header__sub {
      margin-top: 12px; font-size: 17px; color: #666;
      font-weight: 400; line-height: 1.6;
    }

    .steps {
      flex: 1; display: flex; flex-direction: column;
      gap: 20px; position: relative; z-index: 1;
    }
    .step {
      display: flex; gap: 20px; align-items: flex-start;
      padding: 24px; border-radius: 20px;
      background: white; box-shadow: 0 2px 16px rgba(0,0,0,0.04);
    }
    .step__badge {
      flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-family: "Fredoka", sans-serif; font-size: 20px; font-weight: 700;
      color: white;
    }
    .step:nth-child(1) .step__badge { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }
    .step:nth-child(2) .step__badge { background: linear-gradient(135deg, #A8E063, #56AB2F); }
    .step:nth-child(3) .step__badge { background: linear-gradient(135deg, #667EEA, #764BA2); }
    .step:nth-child(4) .step__badge { background: linear-gradient(135deg, #F093FB, #F5576C); }
    .step:nth-child(5) .step__badge { background: linear-gradient(135deg, #4FACFE, #00F2FE); }

    .step__content { flex: 1; }
    .step__title {
      font-size: 20px; font-weight: 700; color: #2D2D2D; margin-bottom: 6px;
    }
    .step__desc { font-size: 14px; color: #777; line-height: 1.7; }

    .footer {
      position: relative; z-index: 1; margin-top: 32px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer__author {
      font-size: 14px; color: #999; font-weight: 500;
    }
    .footer__cta {
      padding: 10px 24px; border-radius: 30px;
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: white; font-size: 13px; font-weight: 600;
      border: none; letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card-canvas">
    <div class="deco-circle deco-circle--1"></div>
    <div class="deco-circle deco-circle--2"></div>
    <div class="deco-circle deco-circle--3"></div>

    <div class="header">
      <div class="header__emoji">✨</div>
      <h1 class="header__title"><span>5 分钟</span>学会<br>做出高级感早餐</h1>
      <p class="header__sub">不早起也能吃得精致又健康</p>
    </div>

    <div class="steps">
      <div class="step">
        <div class="step__badge">1</div>
        <div class="step__content">
          <h3 class="step__title">隔夜燕麦打底</h3>
          <p class="step__desc">前晚把燕麦+牛奶放冰箱，早上直接吃，零烹饪</p>
        </div>
      </div>
      <div class="step">
        <div class="step__badge">2</div>
        <div class="step__content">
          <h3 class="step__title">水果切片摆盘</h3>
          <p class="step__desc">选 2-3 种颜色对比强的水果，视觉冲击拉满</p>
        </div>
      </div>
      <div class="step">
        <div class="step__badge">3</div>
        <div class="step__content">
          <h3 class="step__title">坚果碎增加层次</h3>
          <p class="step__desc">随手撒一把，口感和营养双重加分</p>
        </div>
      </div>
      <div class="step">
        <div class="step__badge">4</div>
        <div class="step__content">
          <h3 class="step__title">蜂蜜/酸奶淋面</h3>
          <p class="step__desc">一小勺蜂蜜画圈，拍照超上镜</p>
        </div>
      </div>
      <div class="step">
        <div class="step__badge">5</div>
        <div class="step__content">
          <h3 class="step__title">选对容器很关键</h3>
          <p class="step__desc">玻璃杯/木碗/陶瓷碟，器皿决定氛围感</p>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="footer__author">@ 你的账号名</span>
      <span class="footer__cta">收藏这篇 →</span>
    </div>
  </div>
</body>
</html>
